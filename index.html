<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Picoballoon Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Custom Style -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar -->
        <aside id="sidebar">
            <header>
                <h1>🎈 Picoballoon Fleet</h1>
                <p class="subtitle">Amateur SondeHub Live Tracker</p>
            </header>
            
            <section class="stats-container">
                <div class="stat-card active-card">
                    <span class="stat-label">Active</span>
                    <span id="count-active" class="stat-value">0</span>
                </div>
                <div class="stat-card landed-card">
                    <span class="stat-label">Landed</span>
                    <span id="count-landed" class="stat-value">0</span>
                </div>
            </section>

            <nav class="balloon-list-wrapper">
                <h2>Active Missions</h2>
                <ul id="active-list" class="balloon-list">
                    <li class="loading">Loading live data...</li>
                </ul>

                <h2>Landed / Inactive</h2>
                <ul id="landed-list" class="balloon-list">
                    <li class="loading">Loading archive data...</li>
                </ul>
            </nav>
            
            <footer>
                <p>Data provided by <a href="https://amateur.sondehub.org/" target="_blank" rel="noopener">SondeHub Amateur</a></p>
            </footer>
        </aside>

        <!-- Map Container -->
        <main id="map"></main>
    </div>

    <!-- Leaflet JS -->
    <script href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- App Script -->
    <script src="js/app.js"></script>
</body>
</html>
